name: CI - Lint, Security & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check .

  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7.0" "pip-audit>=2.7.0"

      - name: Run Bandit SAST Scan
        run: |
          bandit -c pyproject.toml -r app_multi.py models/ rag/ utils/

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    needs: [lint, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            libgl1 \
            libglib2.0-0 \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite (Unit & Integration)
        run: |
          pytest -m "not browser" \
            --cov=models \
            --cov=rag \
            --cov=utils \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  ui-test:
    name: Headless Browser & Theme Contrast E2E Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            libgl1 \
            libglib2.0-0 \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Launch Streamlit in Background
        run: |
          streamlit run app_multi.py \
            --server.port 8501 \
            --server.headless true \
            --server.address 127.0.0.1 \
            --browser.gatherUsageStats false &

      - name: Wait for Streamlit Healthcheck
        run: |
          echo "Waiting for Streamlit server on http://localhost:8501/_stcore/health..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8501/_stcore/health | grep -q "ok"; then
              echo "Streamlit server is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Streamlit server failed to start in 30 seconds."
          exit 1

      - name: Run Selenium Browser Tests
        run: |
          pytest -m browser

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure-artifacts
          path: |
            screenshots/
          if-no-files-found: ignore
          retention-days: 7
